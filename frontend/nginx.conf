server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PDF download
    location = /Dissertation.pdf {
        add_header Content-Disposition "attachment; filename=Hate_Speech_Classification_Dissertation.pdf";
        try_files $uri =404;
    }

    # Reverse proxy API requests directly to backend service
    location /predict {
        proxy_pass http://backend:8000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /info {
        proxy_pass http://backend:8000/info;
        proxy_set_header Host $host;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
