# Local-dev tuning for prometheus-community/kube-prometheus-stack on a resource-constrained
# `kind` cluster. See CLAUDE.md for the reasoning (no alert receivers configured, and this box
# has already hit one real OOMKilled during the Kubernetes phase).

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Let Prometheus pick up ServiceMonitors anywhere in the cluster (e.g. the `backend`
    # ServiceMonitor in the `default` namespace), not just ones carrying this Helm release's
    # label.
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 1d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

grafana:
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Grafana 13's startup (apiserver, provisioning controllers, plugin loading) is slow on this
  # shared/CPU-contended kind node — the chart's default liveness/readiness timing killed it
  # mid-startup in a restart loop. Give it a much longer runway before probes start counting.
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
