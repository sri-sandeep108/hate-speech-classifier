services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      HF_MODEL_REPO: thenewguyhere/hate-speech-distilbert
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
